name: HostStorm CI

on:
  push:
    branches: [main, beta, v2-manager, v3-professional, v4-ai-live-host]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            multi-live/requirements.txt
            multi-live/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app.py hoststorm
      - name: Run tests
        env:
          HOSTSTORM_APP_DIR: /tmp/hoststorm-test
          LV2_ADMIN_PASSWORD: test
          HOSTSTORM_SECRET_KEY: ci-secret-key
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Validate host scripts
        working-directory: .
        run: |
          bash -n scripts/update.sh
          bash -n scripts/rollback.sh
          bash -n scripts/host-update-agent.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          LV2_ADMIN_PASSWORD: test
          HOSTSTORM_SECRET_KEY: ci-secret-key
        run: docker compose config >/dev/null
      - name: Build Multi Live image
        run: docker build -t hoststorm-multi-live-ci ./multi-live
      - name: Smoke test health endpoint
        run: |
          docker run -d --name hoststorm-ci -e LV2_ADMIN_PASSWORD=test -e HOSTSTORM_SECRET_KEY=ci-secret-key -p 3040:3040 hoststorm-multi-live-ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3040/healthz | grep -q '"ok":true'; then
              docker logs hoststorm-ci
              exit 0
            fi
            sleep 2
          done
          docker logs hoststorm-ci
          exit 1

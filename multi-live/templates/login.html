<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • HostStorm</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='v32.css') }}"></head><body class="login-body"><main class="login-card"><div class="login-mark">HS</div><h1>HostStorm Professional</h1><p>Control plane de transmissão</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><label>Usuário<input name="username" autocomplete="username" required autofocus></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><label>Código 2FA <small>(se ativado)</small><input name="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><button class="btn primary full">Entrar</button></form><div class="login-divider"><span>ou</span></div><button class="btn passkey-button full" type="button" id="passkeyLogin">🔐 Entrar com Passkey</button><div class="passkey-login-status" id="passkeyStatus"></div><small class="login-foot">Senha + TOTP ou Passkey/WebAuthn • API tokens separados</small></main><script>
const b64buf=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer};
const buf64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const authOpts=o=>{o.challenge=b64buf(o.challenge);if(o.allowCredentials)o.allowCredentials=o.allowCredentials.map(x=>({...x,id:b64buf(x.id)}));return o};
const authCred=c=>({id:c.id,rawId:buf64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,clientExtensionResults:c.getClientExtensionResults(),response:{authenticatorData:buf64(c.response.authenticatorData),clientDataJSON:buf64(c.response.clientDataJSON),signature:buf64(c.response.signature),userHandle:c.response.userHandle?buf64(c.response.userHandle):null}});
document.getElementById('passkeyLogin').onclick=async()=>{const btn=document.getElementById('passkeyLogin'),status=document.getElementById('passkeyStatus');if(!window.PublicKeyCredential){status.textContent='Este navegador não oferece WebAuthn/Passkey.';return}btn.disabled=true;status.textContent='Aguardando sua Passkey...';try{let r=await fetch('/api/passkeys/login/options',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao iniciar Passkey');const cred=await navigator.credentials.get({publicKey:authOpts(j.publicKey)});r=await fetch('/api/passkeys/login/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:authCred(cred)})});j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Passkey recusada');location.href=j.redirect||'/';}catch(e){status.textContent=e.message||String(e)}finally{btn.disabled=false}};
</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • HostStorm</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body class="login-body"><main class="login-card"><div class="login-mark">HS</div><h1>HostStorm Professional</h1><p>Control plane de transmissão</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><label>Usuário<input name="username" autocomplete="username" required autofocus></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><label>Código 2FA <small>(se ativado)</small><input name="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><button class="btn primary full">Entrar</button></form><small class="login-foot">Sessão protegida • 2FA opcional • API tokens separados</small></main></body></html>

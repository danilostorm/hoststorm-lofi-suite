services:
  hoststorm-agent:
    build:
      context: ./multi-live
    container_name: hoststorm-agent
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      LV2_ADMIN_USER: ${LV2_ADMIN_USER:-agent-admin}
      LV2_ADMIN_PASSWORD: ${LV2_ADMIN_PASSWORD}
      HOSTSTORM_SECRET_KEY: ${HOSTSTORM_SECRET_KEY}
      HOSTSTORM_AGENT_TOKEN: ${HOSTSTORM_AGENT_TOKEN}
      HOSTSTORM_AGENT_MODE: "1"
      HOSTSTORM_NODE_ID: ${HOSTSTORM_NODE_ID:-}
      HOSTSTORM_CONTROLLER_URL: ${HOSTSTORM_CONTROLLER_URL:-}
      HOSTSTORM_COOKIE_SECURE: "0"
      HOSTSTORM_WATCH_ENABLED: "0"
    ports:
      - "${HOSTSTORM_AGENT_PORT:-3040}:3040"
    volumes:
      - /opt/hoststorm-agent/media:/app/media
      - /opt/hoststorm-agent/data:/app/data
      - /opt/hoststorm-agent/logs:/app/logs

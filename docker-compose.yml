services:
  loop-studio:
    build:
      context: ./loop-studio
    container_name: hoststorm-lofi-loop-studio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      LV2_ADMIN_USER: ${LV2_ADMIN_USER:-admin}
      LV2_ADMIN_PASSWORD: ${LV2_ADMIN_PASSWORD}
    ports:
      - "3035:3035"
    volumes:
      - ./loop-studio/uploads:/app/uploads
      - ./loop-studio/outputs:/app/outputs
      - ./loop-studio/logos:/app/logos

  multi-live:
    build:
      context: ./multi-live
    container_name: hoststorm-multi-live-manager
    init: true
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      LV2_ADMIN_USER: ${LV2_ADMIN_USER:-admin}
      LV2_ADMIN_PASSWORD: ${LV2_ADMIN_PASSWORD}
      LV2_MAX_UPLOAD_GB: ${LV2_MAX_UPLOAD_GB:-40}
      LV2_SCHEDULER_GRACE_SECONDS: ${LV2_SCHEDULER_GRACE_SECONDS:-120}
      LV2_SCHEDULER_INTERVAL_SECONDS: ${LV2_SCHEDULER_INTERVAL_SECONDS:-5}
      LV2_SUPERVISOR_INTERVAL_SECONDS: ${LV2_SUPERVISOR_INTERVAL_SECONDS:-5}
      HOSTSTORM_SECRET_KEY: ${HOSTSTORM_SECRET_KEY:-}
      HOSTSTORM_COOKIE_SECURE: ${HOSTSTORM_COOKIE_SECURE:-0}
      HOSTSTORM_WATCH_ENABLED: ${HOSTSTORM_WATCH_ENABLED:-1}
      HOSTSTORM_WATCH_INTERVAL_SECONDS: ${HOSTSTORM_WATCH_INTERVAL_SECONDS:-30}
      HOSTSTORM_RETENTION_HOUR: ${HOSTSTORM_RETENTION_HOUR:-3}
      HOSTSTORM_BACKUP_HOUR: ${HOSTSTORM_BACKUP_HOUR:-4}
      HOSTSTORM_LOG_RETENTION_DAYS: ${HOSTSTORM_LOG_RETENTION_DAYS:-30}
      HOSTSTORM_BACKUP_KEEP: ${HOSTSTORM_BACKUP_KEEP:-20}
      HOSTSTORM_RECORDING_RETENTION_DAYS: ${HOSTSTORM_RECORDING_RETENTION_DAYS:-30}
      HOSTSTORM_CLIP_RETENTION_DAYS: ${HOSTSTORM_CLIP_RETENTION_DAYS:-60}
      HOSTSTORM_PLATFORM_API_INTERVAL_SECONDS: ${HOSTSTORM_PLATFORM_API_INTERVAL_SECONDS:-60}
      HOSTSTORM_CPU_ALERT: ${HOSTSTORM_CPU_ALERT:-92}
      HOSTSTORM_RAM_ALERT: ${HOSTSTORM_RAM_ALERT:-92}
      HOSTSTORM_DISK_ALERT: ${HOSTSTORM_DISK_ALERT:-90}
      HOSTSTORM_UPDATE_CHANNEL: ${HOSTSTORM_UPDATE_CHANNEL:-stable}
      HOSTSTORM_GIT_SHA: ${HOSTSTORM_GIT_SHA:-}
    ports:
      - "3040:3040"
    volumes:
      - ./multi-live/media:/app/media
      - ./multi-live/data:/app/data
      - ./multi-live/logs:/app/logs

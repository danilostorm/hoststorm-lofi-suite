services:
  loop-studio:
    build:
      context: ./loop-studio
    container_name: hoststorm-lofi-loop-studio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      LV2_ADMIN_USER: ${LV2_ADMIN_USER:-admin}
      LV2_ADMIN_PASSWORD: ${LV2_ADMIN_PASSWORD}
    ports:
      - "3035:3035"
    volumes:
      - ./loop-studio/uploads:/app/uploads
      - ./loop-studio/outputs:/app/outputs
      - ./loop-studio/logos:/app/logos

  multi-live:
    build:
      context: ./multi-live
    container_name: hoststorm-multi-live-manager
    init: true
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      LV2_ADMIN_USER: ${LV2_ADMIN_USER:-admin}
      LV2_ADMIN_PASSWORD: ${LV2_ADMIN_PASSWORD}
      LV2_MAX_UPLOAD_GB: ${LV2_MAX_UPLOAD_GB:-40}
      LV2_SCHEDULER_GRACE_SECONDS: ${LV2_SCHEDULER_GRACE_SECONDS:-120}
      LV2_SCHEDULER_INTERVAL_SECONDS: ${LV2_SCHEDULER_INTERVAL_SECONDS:-5}
      LV2_SUPERVISOR_INTERVAL_SECONDS: ${LV2_SUPERVISOR_INTERVAL_SECONDS:-5}
    ports:
      - "3040:3040"
    volumes:
      - ./multi-live/media:/app/media
      - ./multi-live/data:/app/data
      - ./multi-live/logs:/app/logs
